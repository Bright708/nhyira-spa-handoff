# Render Blueprint for the API. Render > New > Blueprint > pick this repo.
services:
  - type: web
    name: nhyira-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ROOMS
        value: "2"
      - key: CLIENT_URL
        sync: false # e.g. https://nhyira-spa.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
